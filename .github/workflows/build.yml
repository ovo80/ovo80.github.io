name: Build and Check

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:
    branches: [ main ] # Adjust branches as needed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        node: [ 22 ] # Node 23 fails CSS build (@apply cross-file custom class); use LTS only
    runs-on: ubuntu-latest
    name: Astro Check for Node.js ${{ matrix.node }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }} # Use LTS
          package-manager-cache: false # pnpm installed in a later step; disable auto cache lookup

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        run: npm install -g pnpm@9.14.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Check
        run: pnpm astro check

  build:
    strategy:
      matrix:
        node: [ 22 ] # Node 23 fails CSS build (@apply cross-file custom class); use LTS only
    runs-on: ubuntu-latest
    name: Astro Build for Node.js ${{ matrix.node }} # Corrected job name
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false # pnpm installed in a later step; disable auto cache lookup

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        run: npm install -g pnpm@9.14.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Build
        run: pnpm astro build
